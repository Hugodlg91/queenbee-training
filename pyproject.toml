[project]
name = "queenbee"
version = "0.3.0"
description = "Queen Bee — fil rouge du module BC3 Architecture logicielle (ITIS MAST CYBER 4 et MAST DEV 4)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "hypothesis>=6", "ruff>=0.16", "mypy>=2", "bandit>=1.9", "pip-audit>=2.10", "import-linter>=2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["lab: démonstrations d'exploitation sur la variante vulnérable"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "labs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S301", "S311", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "legacy", "labs"]

[tool.importlinter]
root_package = "queenbee"

[[tool.importlinter.contracts]]
name = "Architecture hexagonale : les dépendances pointent vers le domaine"
type = "layers"
layers = [
    "queenbee.bootstrap",
    "queenbee.adapters",
    "queenbee.application",
    "queenbee.domain",
]
